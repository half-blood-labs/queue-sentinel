# Copy this file (drop the .example suffix), fill in real values, and
# `kubectl apply` the copy. Do not commit the filled-in copy — manage real
# secrets with your usual tooling (sealed-secrets, external-secrets, sops,
# a vault, etc.) instead of a plain Secret manifest in git.
apiVersion: v1
kind: Secret
metadata:
  name: queue-sentinel-secrets
type: Opaque
stringData:
  AMQP_URL: "amqp://user:pass@your-rabbitmq-host:5672" # EDIT ME
  OPENAI_API_KEY: "" # only needed if AI_PROVIDER=openai
