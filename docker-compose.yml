services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  producer:
    build: .
    entrypoint: ["node", "demo/producer.js"]
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["node", "demo/worker.js"]
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Not started by `docker compose up`. Run on demand, e.g.:
  #   docker compose run --rm queue-sentinel --amqp-url amqp://guest:guest@rabbitmq:5672 --exchange orders.dlx
  queue-sentinel:
    build: .
    profiles: ["cli"]
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
